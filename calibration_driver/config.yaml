tag: "20y"

paths:
  base: "/scratch/pp2681/mom6/CM26_Double_Gyre/calibration/20-years"
  optimization_folder: "R2_FGR3_series_torch"
  ann: "/scratch/pp2681/mom6/CM26_ML_models/ocean3d/subfilter/FGR3/equivariant/learning_rate/N8-forcing-fluxes/0.05/model/"
  observation: "/home/pp2681/calibration/scripts/R32/R2_FGR3_series_loss.nc"
  executable: "/scratch/pp2681/MOM6-examples/build/compiled_executables/MOM6-dev-m2lines-Aug18"
  configuration: "/home/pp2681/MOM6-examples/build/configurations/double_gyre_long"
  prior_cov: None
  #prior_cov: "/home/pp2681/calibration/scripts/priors/weights2_biases2_Cxx_prior_cond_100.npy"

eki:
  n_iterations: 3
  ens_size: 100
  ens_spread: 0.25
  seed: 0
  seed_julia: 2
  outlier_scale: 1.e+9
  gamma_scaling_factor: 1.e-5
  inversion: "TransformInversion()"
  scheduler: "DataMisfitController(terminate_at=1e+100)"
  trainable_parameters: ["weights2", "biases2"]
  observation_vector: ["e_mean", "e_std", "KE_mean", "KE_std", "APE_mean", "APE_std"]
  gamma_vector: ["e_mean_var_loss", "e_std_var_loss", "KE_mean_var_loss", "KE_std_var_loss", "APE_mean_var_loss", "APE_std_var_loss"]
  observation_validation: ["e_mean", "e_std", "KE_mean", "KE_std", "APE_mean", "APE_std"]
  gamma_validation: ["e_mean_var_loss", "e_std_var_loss", "KE_mean_var_loss", "KE_std_var_loss", "APE_mean_var_loss", "APE_std_var_loss"]
  metrics_function: "return_climate_metrics"

mom6_namelist:
  DAYMAX: 7300.0
  USE_ZB2020: "True"
  ZB2020_USE_ANN: "True"
  ZB2020_ANN_FILE_TALL: "INPUT/Tall.nc"
  USE_CIRCULATION_IN_HORVISC: "True"
  ZB_SCALING: 1.0

slurm_eki: "sbatch --time=02:00:00 --cpus-per-task=4 --mem=16GB"

slurm_mom6:
  time: 2

